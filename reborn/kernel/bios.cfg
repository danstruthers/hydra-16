# ****************************************************************************
# bios.cfg - the BIOS ROM (128K: 16 pages of 8K at $E000, the page selected by W).  The kernel and nothing else
# (docs/reimplementation-from-scratch.md, principle P1).  On every page: the reset stub at $E000 (W isn't reset
# by the hardware), the COMMON block at $FD00 (identical everywhere: IRQ entry and exit, the kernel's far call),
# the page's number at $FDFF (POST reads it to test the W lines), the vectors at $FFFA.  Page 0 has the kernel's
# core and the jump table at $F800; page 1 tasks and memory; page 4 POST; the rest room to grow.  A routine on
# another page is reached with FARCALL (kernel/kdefs.inc): each memory area's bank is its page number.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    P0:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0;
    P1:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $1;
    P2:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $2;
    P3:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $3;
    P4:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $4;
    P5:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $5;
    P6:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $6;
    P7:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $7;
    P8:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $8;
    P9:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $9;
    PA:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $A;
    PB:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $B;
    PC:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $C;
    PD:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $D;
    PE:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $E;
    PF:     start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $F;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    # Page 0: the kernel's core
    RESET_P0:   load = P0, type = ro;
    KCODE:      load = P0, type = ro;
    KRODATA:    load = P0, type = ro;
    JUMPTABLE:  load = P0, type = ro, offset = $1800;
    COMMON_P0:  load = P0, type = ro, offset = $1D00;
    ID_P0:      load = P0, type = ro, offset = $1DFF;
    HIGH_P0:    load = P0, type = ro, offset = $1E00, optional = yes;
    VEC_P0:     load = P0, type = ro, offset = $1FFA;
    RESET_P1:   load = P1, type = ro;
    # Page 1: tasks and memory
    KCODE_P1:   load = P1, type = ro, optional = yes;
    KRODATA_P1: load = P1, type = ro, optional = yes;
    COMMON_P1:  load = P1, type = ro, offset = $1D00;
    ID_P1:      load = P1, type = ro, offset = $1DFF;
    VEC_P1:     load = P1, type = ro, offset = $1FFA;
    RESET_P2:   load = P2, type = ro;
    COMMON_P2:  load = P2, type = ro, offset = $1D00;
    ID_P2:      load = P2, type = ro, offset = $1DFF;
    VEC_P2:     load = P2, type = ro, offset = $1FFA;
    RESET_P3:   load = P3, type = ro;
    COMMON_P3:  load = P3, type = ro, offset = $1D00;
    ID_P3:      load = P3, type = ro, offset = $1DFF;
    VEC_P3:     load = P3, type = ro, offset = $1FFA;
    RESET_P4:   load = P4, type = ro;
    # Page 4: POST
    KCODE_P4:   load = P4, type = ro, optional = yes;
    KRODATA_P4: load = P4, type = ro, optional = yes;
    COMMON_P4:  load = P4, type = ro, offset = $1D00;
    ID_P4:      load = P4, type = ro, offset = $1DFF;
    VEC_P4:     load = P4, type = ro, offset = $1FFA;
    RESET_P5:   load = P5, type = ro;
    COMMON_P5:  load = P5, type = ro, offset = $1D00;
    ID_P5:      load = P5, type = ro, offset = $1DFF;
    VEC_P5:     load = P5, type = ro, offset = $1FFA;
    RESET_P6:   load = P6, type = ro;
    COMMON_P6:  load = P6, type = ro, offset = $1D00;
    ID_P6:      load = P6, type = ro, offset = $1DFF;
    VEC_P6:     load = P6, type = ro, offset = $1FFA;
    RESET_P7:   load = P7, type = ro;
    COMMON_P7:  load = P7, type = ro, offset = $1D00;
    ID_P7:      load = P7, type = ro, offset = $1DFF;
    VEC_P7:     load = P7, type = ro, offset = $1FFA;
    RESET_P8:   load = P8, type = ro;
    COMMON_P8:  load = P8, type = ro, offset = $1D00;
    ID_P8:      load = P8, type = ro, offset = $1DFF;
    VEC_P8:     load = P8, type = ro, offset = $1FFA;
    RESET_P9:   load = P9, type = ro;
    COMMON_P9:  load = P9, type = ro, offset = $1D00;
    ID_P9:      load = P9, type = ro, offset = $1DFF;
    VEC_P9:     load = P9, type = ro, offset = $1FFA;
    RESET_PA:   load = PA, type = ro;
    COMMON_PA:  load = PA, type = ro, offset = $1D00;
    ID_PA:      load = PA, type = ro, offset = $1DFF;
    VEC_PA:     load = PA, type = ro, offset = $1FFA;
    RESET_PB:   load = PB, type = ro;
    COMMON_PB:  load = PB, type = ro, offset = $1D00;
    ID_PB:      load = PB, type = ro, offset = $1DFF;
    VEC_PB:     load = PB, type = ro, offset = $1FFA;
    RESET_PC:   load = PC, type = ro;
    COMMON_PC:  load = PC, type = ro, offset = $1D00;
    ID_PC:      load = PC, type = ro, offset = $1DFF;
    VEC_PC:     load = PC, type = ro, offset = $1FFA;
    RESET_PD:   load = PD, type = ro;
    COMMON_PD:  load = PD, type = ro, offset = $1D00;
    ID_PD:      load = PD, type = ro, offset = $1DFF;
    VEC_PD:     load = PD, type = ro, offset = $1FFA;
    RESET_PE:   load = PE, type = ro;
    COMMON_PE:  load = PE, type = ro, offset = $1D00;
    ID_PE:      load = PE, type = ro, offset = $1DFF;
    VEC_PE:     load = PE, type = ro, offset = $1FFA;
    RESET_PF:   load = PF, type = ro;
    COMMON_PF:  load = PF, type = ro, offset = $1D00;
    ID_PF:      load = PF, type = ro, offset = $1DFF;
    VEC_PF:     load = PF, type = ro, offset = $1FFA;
}
