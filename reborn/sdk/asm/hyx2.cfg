# ****************************************************************************
# hyx2.cfg - a RAM program (HYX2: sdk/asm/hyx2.inc, assembled with -D HYX2_RAM), a program in a file: its header,
# code, read-only data and data in one image from $0800, which SPAWN's loader reads there, and its BSS after them
# (cleared as it loads; its break starts at the end).  Its zero page is $22-$7F (the program's).
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw, file = "";
    RAM:    start = $0800, size = $7800, type = rw, file = %O, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = RAM, type = ro;
    CODE:       load = RAM, type = ro;
    RODATA:     load = RAM, type = ro, optional = yes;
    DATA:       load = RAM, type = rw, define = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
