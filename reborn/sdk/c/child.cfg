# ****************************************************************************
# child.cfg - a bank program, a child (bankprog.h): an o65 module (ld65's), linked at $8000 where it's run, in a
# RAM bank of its caller's own: its code, read-only data, data and BSS one after another, one bank at most less the
# room its exports' table takes; its zero page from 0 (the loader puts it in the bytes its caller gives children).
# What it uses of its callers (cc65's runtime's helpers and zero page, their functions, their data) are its imports,
# and its globals its exports (its entries): the build lists both in its FORMATS line (build.js's buildChild, from
# od65's --dump-imports and --dump-exports), in place of IMPORTS_AND_EXPORTS.  No library linked: all it uses but
# its own code is its caller's.
# ****************************************************************************
MEMORY {
    ZP:     start = $0000, size = $0040, type = rw, define = yes;   # (In the file: o65's zero segment, relocated)
    BANK:   file = %O, start = $8000, size = $1F00, type = rw, define = yes;
}
FILES {
    %O: format = o65;
}
FORMATS {
    o65: os = cc65, id = $8001, type = small, IMPORTS_AND_EXPORTS;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp,  optional = yes;
    CODE:       load = BANK, type = ro;
    RODATA:     load = BANK, type = ro,  optional = yes;
    DATA:       load = BANK, type = rw,  optional = yes;
    BSS:        load = BANK, type = bss, optional = yes, define = yes;
}
