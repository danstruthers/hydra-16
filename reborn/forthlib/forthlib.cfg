# ****************************************************************************
# forthlib.cfg - a HyForth library's link (tools/forthlib.js): its code, data and BSS one after another from 0, in
# an o65 file (its relocations), which forthlib.js makes a library file of; loaded into the dictionary at HERE.  Its
# zero page and variables are the core's (forthcore.inc), or its own in its image.
MEMORY {
    ZP:     start = $0000, size = $0100;
    LIB:    file = %O, start = $0000, size = $4000;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    CODE:       load = LIB, type = ro;
    RODATA:     load = LIB, type = ro, optional = yes;
    DATA:       load = LIB, type = rw, optional = yes;
    BSS:        load = LIB, type = bss, optional = yes;
}
FILES {
    %O: format = o65;
}
FORMATS {
    o65: os = cc65, type = small;
}
