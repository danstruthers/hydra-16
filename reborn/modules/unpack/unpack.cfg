# ****************************************************************************
# unpack.cfg - the unpack library's link (modules/unpack: HT_LIBRARY, one bank): its header, its entry and its code at
# $A000.  No RAM of its own (a library runs in its caller's task): its pointers are the call registers (r2-r12), its
# buffer the RAM bank it fills.
MEMORY {
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
}
SEGMENTS {
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
}
