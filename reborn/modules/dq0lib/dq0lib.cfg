# ****************************************************************************
# dq0lib.cfg - Dingus Quest Zero's library's link (modules/dq0lib: HT_LIBRARY, one bank): its header, its entries and
# its code at $A000.  No RAM of its own (a library runs in its caller's task): its arguments the call registers, what
# it keeps over a call the stack's.
MEMORY {
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
}
SEGMENTS {
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
}
