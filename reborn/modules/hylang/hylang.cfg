# ****************************************************************************
# hylang.cfg - hylang's link (build.js uses a module's own NAME.cfg): module6.cfg's, six banks run in place, with
# DATA4 besides: the most of its RAM code (the heap, the output, the stack, the machine's helpers), there in its fourth
# bank, which hylang copies to its RAM after DATA (hylang.s: data4_init) as it starts, so the first bank (whose DATA
# the system copies) keeps its room for the evaluator.
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM2:   start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM3:   start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM4:   start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM5:   start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM6:   start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $0400, size = $7BF8, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes;
    DATA4:      load = ROM4, run = RAM, type = rw, define = yes, align = $100;
    PSTATE:     load = RAM, type = bss, define = yes, align = $100;
    CODE2:      load = ROM2, type = ro;
    RODATA2:    load = ROM2, type = ro, optional = yes;
    CODE3:      load = ROM3, type = ro;
    RODATA3:    load = ROM3, type = ro, optional = yes;
    CODE4:      load = ROM4, type = ro;
    RODATA4:    load = ROM4, type = ro, optional = yes;
    CODE5:      load = ROM5, type = ro;
    RODATA5:    load = ROM5, type = ro, optional = yes;
    CODE6:      load = ROM6, type = ro;
    RODATA6:    load = ROM6, type = ro, optional = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
