# ****************************************************************************
# hylang.cfg - hylang's link: the program, a module of three banks (its header, code and read-only data at $A000 in
# its first bank, CODE2 and RODATA2 in its second, CODE3 and RODATA3 in its third; its data and BSS in its task's RAM
# from $0400), and its library modules (HT_LIBRARY), each of one bank, its header first: hylnum, the numbers (NUMCODE,
# NUMDATA), and hylstr, strings and hashes (STRCODE, STRDATA).  build.js links a module with its folder's NAME.cfg if
# it has one, and makes each file %O.LIBRARY the module LIBRARY.
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM2:   start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, define = yes;
    ROM3:   start = $A000, size = $4000, type = ro, file = %O, define = yes;
    NUM:    start = $A000, size = $4000, type = ro, file = "%O.hylnum", define = yes;
    STR:    start = $A000, size = $4000, type = ro, file = "%O.hylstr", define = yes;
    RAM:    start = $0400, size = $7BF8, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes;
    CODE2:      load = ROM2, type = ro;
    RODATA2:    load = ROM2, type = ro, optional = yes;
    CODE3:      load = ROM3, type = ro;
    RODATA3:    load = ROM3, type = ro, optional = yes;
    NUMHEAD:    load = NUM, type = ro;
    NUMCODE:    load = NUM, type = ro;
    NUMDATA:    load = NUM, type = ro, optional = yes;
    STRHEAD:    load = STR, type = ro;
    STRCODE:    load = STR, type = ro;
    STRDATA:    load = STR, type = ro, optional = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
