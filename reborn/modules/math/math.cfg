# ****************************************************************************
# math.cfg - the math library's link (modules/math: HT_LIBRARY, as numbers.cfg): its header, jump table, code and read-only
# data at $A000 in its own bank, as any module's; no data or BSS of its own (a library runs in its caller's task),
# but the RAM bank its caller gives it (NUMBANK, at $8000 while it runs: its registers, buffers and state), and the
# zero page it borrows for a call ($70-$7F, saved and put back).
MEMORY {
    ZP:     start = $0070, size = $0010, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $0400, size = $0001, type = rw, file = "", define = yes;
    BANK:   start = $8000, size = $2000, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes, optional = yes;
    BSS:        load = RAM, type = bss, define = yes, optional = yes;
    NUMBANK:    load = BANK, type = bss, define = yes, align = $100;
}
