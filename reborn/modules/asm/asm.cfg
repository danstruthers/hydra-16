# ****************************************************************************
# asm.cfg - the asm library's link (modules/asm: HT_LIBRARY, one bank): its header, jump table, the assembler and
# the disassembler at $A000.  No RAM of its own: the assembler's state
# (its BSS) is in RAM its caller lends it while a call runs (ASM_RAM, $5000-$7DFF: free in the as program's task and in
# BASIC's while it compiles), and its zero page ($22 on) is the caller's, kept as a call starts and put back as it ends.
MEMORY {
    ZP:     start = $0022, size = $0010, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $5000, size = $2E00, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes, optional = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
