# ****************************************************************************
# asm.cfg - the asm library's link (modules/asm: HT_LIBRARY, as numbers.cfg): its header, jump table, code and
# read-only data at $A000 in its own bank, as any module's; no data, BSS or bank of RAM of its own (a library runs in
# its caller's task, and the asm library keeps nothing between calls).
MEMORY {
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $0400, size = $0001, type = rw, file = "", define = yes;
}
SEGMENTS {
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes, optional = yes;
    BSS:        load = RAM, type = bss, define = yes, optional = yes;
}
