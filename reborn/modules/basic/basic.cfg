# ****************************************************************************
# basic.cfg - BASIC's link (build.js uses a module's own NAME.cfg): module.cfg's, one bank run in place, with the
# token and error tables in segments of their own (the keyword macros lay down two tables at once: bmacros.inc), and
# the line buffer first in RAM, a page of its own ($0400: the tokenizer indexes the line by its address's low byte,
# and writes the line crunched from 5 bytes before it)
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $0400, size = $7BF8, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    VECTORS:    load = ROM, type = ro;
    KEYWORDS:   load = ROM, type = ro;
    ERRTAB:     load = ROM, type = ro;
    ERROR:      load = ROM, type = ro;
    LINEBUF:    load = RAM, type = bss, align = $100, define = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
