# ****************************************************************************
# dq0acct.cfg - (dq0acct) sdk/c/hydra.cfg's link, and three overlays at the window (%O.ovl: lib/dq0/dq0acct.ovl, 8K each, the last as
# long as it is, read into banks as it starts): the days at rest (OV1, body.c) what it earns and learns (OV2, skill.c), the sheet (OV3, sheet.c, hfile.c)
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (a link that leaves
                                                        #   less fails, rather than the stack running over the BSS)
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __RAMTOP__ - __STACKMIN__ - $0800, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = rw, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = rw, define = yes, fill = yes, fillval = $FF;
    OV3:    file = "%O.ovl", start = $8000, size = $2000, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    OV1CODE:    load = OV1,  type = ro,  define = yes;
    OV1RODATA:  load = OV1,  type = rw,  define = yes;
    OV2CODE:    load = OV2,  type = ro,  define = yes;
    OV2RODATA:  load = OV2,  type = rw,  define = yes;
    OV3CODE:    load = OV3,  type = ro,  define = yes;
    OV3RODATA:  load = OV3,  type = rw,  define = yes;
    OV3BSS:     load = OV3,  type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
