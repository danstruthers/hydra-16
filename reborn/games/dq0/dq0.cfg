    OV23:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-06: the designators' capitals, caps.c: overlay 22's room)
    OV24:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-07: the things' chooser, pick.c: COMMANDS-CRITIQUE.md's §5.1 step C)
    OV25:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-10: part 27's image, prayer, fasting, swimming, following: the banks full)
    OV26:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-10: part 28's image, words said, a knock, the minds swayed: minds.c)
    OV27:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-11: the status line, main.c's, term.c's: the main RAM's room; and room for parts)
    OV28:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-11: the phrase table's rows, said.txt's: read by bank.s's said_b, overlay 27's room; no parts: its room the table's)
    OV29:   file = "%O.ovl", start = $A000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-11: the phrase table's rows, their second bank: at $A000 here, said_b reading it at $8000 by an address past $A000; no parts)
    OV30:   file = "%O.ovl", start = $C000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-15: the phrase table's rows, their third bank: at $C000 here, said_b reading it at $8000 by an address past $C000; no parts)
}
