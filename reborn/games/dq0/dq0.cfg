    OV18:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-02: part 18's image, the room for it))
    OV19:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-03: part 3, overlay 18 full)
    OV20:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-04: the record of a life's parts 21, 22: the account's room)
    OV21:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;    # (2026-11-06: parts 25, 26, the writings read and their clues)
