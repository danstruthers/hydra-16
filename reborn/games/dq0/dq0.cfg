# ****************************************************************************
# dq0.cfg - Dingus Quest Zero's link: sdk/c/hydra.cfg's (the header, code, read-only data and data from $0800, the
# BSS after them, the heap, and the C stack down from __RAMTOP__), and its overlays: code that runs in the RAM bank
# window ($8000-$9FFF), each linked there into 8K of its own in a second file, %O.ovl (OVn at n - 1 times 8K in
# it), which the game reads into its banks as it starts (bank.s).  A C file's code and read-only data go in an
# overlay with #pragma code-name ("OVnCODE") and rodata-name ("OVnRODATA"); its data and BSS stay in MAIN.  And its
# swapped parts (swap.inc): code that runs in the main RAM, at its top (SWAP: __SWAPSIZE__ bytes under the C stack's
# least room), one part at a time, SWn all there, each one's image in an overlay's bank (overlays 8, 9 and 10
# have them), copied into the area as it's called: a C file's code and read-only data in part n with #pragma code-name
# ("SWnCODE") and rodata-name ("SWnRODATA").  The main RAM's room: MAIN's, less what its BSS ends at.
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (hydra.cfg's)
    __SWAPSIZE__:   type = weak,    value = $1100;      # The swapped parts' area: the biggest part, or more
    __SWAP_START__: type = export,  value = __RAMTOP__ - __STACKMIN__ - __SWAPSIZE__;
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __SWAP_START__ - $0800, type = rw, define = yes;
    SW1:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW2:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW3:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW4:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW5:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW6:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW7:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW8:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW9:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV3:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV4:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV5:    file = "%O.ovl", start = $8000, size = $1000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV5T:   file = "%O.ovl", start = $9000, size = $1000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV6:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV7:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV8:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV9:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV10:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV11:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV12:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV13:   file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    OV1CODE:    load = OV1,  type = ro,  optional = yes;
    OV1RODATA:  load = OV1,  type = ro,  optional = yes;
    OV2CODE:    load = OV2,  type = ro,  optional = yes;
    OV2RODATA:  load = OV2,  type = ro,  optional = yes;
    OV3CODE:    load = OV3,  type = ro,  optional = yes;
    OV3RODATA:  load = OV3,  type = ro,  optional = yes;
    OV4CODE:    load = OV4,  type = ro,  optional = yes;
    OV4RODATA:  load = OV4,  type = ro,  optional = yes;
    OV5CODE:    load = OV5,  type = ro,  optional = yes;   # (Its second half the theme's copy: theme.c's TCOPY,
    OV5RODATA:  load = OV5,  type = ro,  optional = yes;   #   main.c's, OV5T only filled)
    OV6CODE:    load = OV6,  type = ro,  optional = yes;
    OV6RODATA:  load = OV6,  type = ro,  optional = yes;
    OV7CODE:    load = OV7,  type = ro,  optional = yes;
    OV7RODATA:  load = OV7,  type = ro,  optional = yes;   # (choose.c's state too: its data there)
    SW1CODE:    load = OV8,  run = SW1,  type = ro,  define = yes;    # (Each part's code then its read-only data,
    SW1RODATA:  load = OV8,  run = SW1,  type = ro,  optional = yes;  #   its image whole in its overlay's bank)
    SW2CODE:    load = OV3,  run = SW2,  type = ro,  define = yes;    # (Part 2's: overlay 3's bank)
    SW2RODATA:  load = OV3,  run = SW2,  type = ro,  optional = yes;
    SW3CODE:    load = OV9,  run = SW3,  type = ro,  define = yes;
    SW3RODATA:  load = OV9,  run = SW3,  type = ro,  optional = yes;
    SW4CODE:    load = OV9,  run = SW4,  type = ro,  define = yes;
    SW4RODATA:  load = OV9,  run = SW4,  type = ro,  optional = yes;
    SW5CODE:    load = OV10, run = SW5,  type = ro,  define = yes;
    SW5RODATA:  load = OV10, run = SW5,  type = ro,  optional = yes;
    SW6CODE:    load = OV12, run = SW6,  type = ro,  define = yes;   # (A bank of its own: the parts' images, slice
    SW6RODATA:  load = OV12, run = SW6,  type = ro,  optional = yes;  #   4.1's room)
    OV12CODE:   load = OV12, type = ro,  optional = yes;   # (After part 6's image: seen.c, overlay 7 full)
    OV12RODATA: load = OV12, type = ro,  optional = yes;
    SW7CODE:    load = OV8,  run = SW7,  type = ro,  define = yes;    # (Part 7's: part 1's bank)
    SW7RODATA:  load = OV8,  run = SW7,  type = ro,  optional = yes;
    OV8CODE:    load = OV8,  type = ro,  optional = yes;   # (After parts 1 and 7's images: task.c's stop words)
    OV8RODATA:  load = OV8,  type = ro,  optional = yes;
    SW8CODE:    load = OV5,  run = SW8,  type = ro,  define = yes;    # (Part 8's: overlay 5's bank, its first half)
    SW8RODATA:  load = OV5,  run = SW8,  type = ro,  optional = yes;
    OV9CODE:    load = OV9,  type = ro,  optional = yes;   # (A line's first look: pace.c's pacing, names.c's
    OV9RODATA:  load = OV9,  type = ro,  optional = yes;   #   names_in, after their parts' images)
    OV10CODE:   load = OV10, type = ro,  optional = yes;
    OV10RODATA: load = OV10, type = ro,  optional = yes;
    OV11CODE:   load = OV11, type = ro,  optional = yes;   # (The command's things resolved: resolve.c)
    OV11RODATA: load = OV11, type = ro,  optional = yes;
    SW9CODE:    load = OV13, run = SW9,  type = ro,  define = yes;    # (Part 9's: a bank of its own)
    SW9RODATA:  load = OV13, run = SW9,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
