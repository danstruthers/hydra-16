# ****************************************************************************
# dq0d.cfg - (dq0d) the denizens' link: sdk/c/hydra.cfg's, but the least room left for the C stack a quarter of
# its ($100): the task's locals are static (its #pragma static-locals), its calls shallow, and its code and BSS want
# the rest.  And its swapped parts (../dq0/swap.inc): code run in the main RAM's top (SWAP: __SWAPSIZE__ bytes under
# the C stack's least room), a part at a time, SWn all there, their images in OV1 (%O.ovl: LIBDIR/dq0d.ovl, read
# into a bank as the task starts), each copied into the area as it's called.
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0100;      # (hydra.cfg's $0300: its locals static, its calls shallow)
    __SWAPSIZE__:   type = weak,    value = $0F00;      # The swapped parts' area (../dq0/swap.inc): the biggest
    __SWAP_START__: type = export,  value = __RAMTOP__ - __STACKMIN__ - __SWAPSIZE__;   #   part, or more
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __SWAP_START__ - $0800, type = rw, define = yes;
    SW1:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW2:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW3:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW4:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW5:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW6:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV3:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes;   # (Morale's, 2026-10-30)
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    SW1CODE:    load = OV1,  run = SW1,  type = ro,  define = yes;
    SW1RODATA:  load = OV1,  run = SW1,  type = ro,  optional = yes;
    SW2CODE:    load = OV1,  run = SW2,  type = ro,  define = yes;
    SW2RODATA:  load = OV1,  run = SW2,  type = ro,  optional = yes;
    SW3CODE:    load = OV2,  run = SW3,  type = ro,  define = yes;
    SW3RODATA:  load = OV2,  run = SW3,  type = ro,  optional = yes;
    SW4CODE:    load = OV2,  run = SW4,  type = ro,  define = yes;
    SW4RODATA:  load = OV2,  run = SW4,  type = ro,  optional = yes;
    SW5CODE:    load = OV2,  run = SW5,  type = ro,  define = yes;    # (Slice 4.5's: the senses' own, a hunter's)
    SW5RODATA:  load = OV2,  run = SW5,  type = ro,  optional = yes;
    SW6CODE:    load = OV3,  run = SW6,  type = ro,  define = yes;    # (Morale, 2026-10-30)
    SW6RODATA:  load = OV3,  run = SW6,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
