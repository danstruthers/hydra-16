    SW10:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW11:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW12:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
