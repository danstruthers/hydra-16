# ****************************************************************************
# dq0nacct.cfg - (dq0nacct: the null ruleset's account) sdk/c/hydra.cfg's link, and two overlays at the window in one file
# (%O.ovl: lib/acct/dq0nacct.ovl, 8K each, the last as long as it is, read into banks as it starts): the account's own (OV1,
# quest.c: what solving brings and the rumours; OV2, town.c: the town); the null ruleset's part is in the main RAM.
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (a link that leaves
                                                        #   less fails, rather than the stack running over the BSS)
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __RAMTOP__ - __STACKMIN__ - $0800, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = rw, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    QUESTCODE:  load = OV1,  type = ro,  define = yes;
    QUESTRODATA: load = OV1, type = rw,  define = yes;
    QUESTBSS:   load = OV1,  type = bss, define = yes;   # (Not in the file: each set before it's read)
    TOWNCODE:   load = OV2,  type = ro,  define = yes;
    TOWNRODATA: load = OV2,  type = rw,  define = yes;
    TOWNBSS:    load = OV2,  type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
