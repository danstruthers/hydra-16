# ****************************************************************************
# dq0m.cfg - (dq0m) the maker's link: sdk/c/hydra.cfg's (the header, code, read-only data and data from $0800, the
# BSS after them, the heap, and the C stack down from __RAMTOP__), and its overlays: code that runs in the RAM bank
# window ($8000-$9FFF), each linked there into 8K of its own in a second file, %O.ovl (OVn at n - 1 times 8K in
# it), which the game reads into its banks as it starts (bank.s).  A C file's code and read-only data go in an
# overlay with #pragma code-name ("OVnCODE") and rodata-name ("OVnRODATA"); its data and BSS stay in MAIN.
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (hydra.cfg's)
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __RAMTOP__ - __STACKMIN__ - $0800, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV3:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV4:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV5:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV6:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    OV1CODE:    load = OV1,  type = ro,  optional = yes;
    OV1RODATA:  load = OV1,  type = ro,  optional = yes;
    OV2CODE:    load = OV2,  type = ro,  optional = yes;
    OV2RODATA:  load = OV2,  type = ro,  optional = yes;
    OV3CODE:    load = OV3,  type = ro,  optional = yes;
    OV3RODATA:  load = OV3,  type = ro,  optional = yes;
    OV4CODE:    load = OV4,  type = ro,  optional = yes;
    OV4RODATA:  load = OV4,  type = ro,  optional = yes;
    OV5CODE:    load = OV5,  type = ro,  optional = yes;
    OV5RODATA:  load = OV5,  type = ro,  optional = yes;
    OV6CODE:    load = OV6,  type = ro,  optional = yes;
    OV6RODATA:  load = OV6,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
