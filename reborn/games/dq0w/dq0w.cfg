SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    SWTAB:      load = OV2,  type = ro;                   # (The parts' records, ../dq0/swap.inc's SWTABOV: swload's,
                                                          #   the main RAM's room, speed12, 2026-11-22)
    SWSTP:      load = OV33, type = ro, define = yes;                 # (The stubs' parts, their functions' low bytes, high: ../dq0/swap.inc's
    SWSTL:      load = OV33, type = ro, define = yes;                 #   SWSTUBOV, bank.s's; a byte a stub each, 4-byte stubs, the main RAM's
    SWSTH:      load = OV33, type = ro, define = yes;                 #   room, room7, 2026-11-23)
    #@SWSEGMENTS
    KINDATA:    load = KIN,  type = ro;                   # (The kinds, at $8000: hub.h's CATALOGUE, in KIND_BANK)
    CATCOMP:    load = CAT,  type = ro;                   # (The compartments, at $8000: kinds.c's comps, make.js's check)
    CATRODATA:  load = CAT,  type = ro,  optional = yes;  # (The catalogue's bank: the burns, the throws, the words)
    CATCODE:    load = CAT,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
