# ****************************************************************************
# dq0w.cfg - (dq0w) the world's link: sdk/c/hydra.cfg's, and its swapped parts (../dq0/swap.inc): code run in the main
# RAM's top (SWAP: __SWAPSIZE__ bytes under the C stack's least room), a part at a time, SWn all there, their images
# in OV1 ... (%O.ovl: LIBDIR/dq0w.ovl, 8K each, read into banks as the task starts), each copied into the area as it's
# called.  And the catalogue (kinds.c, first) and the things' words, then the code that handles things (things.c's,
# CATCODE), linked at $8000 into a file of their own, %O.cat (LIBDIR/dq0w.cat), which the world reads as it starts
# into the hub's catalogue bank, where it's at $8000 as linked (its code run there: bank.s's m0 ...).
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (a link that leaves
                                                        #   less fails, rather than the stack running over the BSS)
    __SWAPSIZE__:   type = weak,    value = $0E00;      # The swapped parts' area (../dq0/swap.inc): the biggest
    __SWAP_START__: type = export,  value = __RAMTOP__ - __STACKMIN__ - __SWAPSIZE__;   #   part, or more
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __SWAP_START__ - $0800, type = rw, define = yes;
    SW1:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW2:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW3:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW4:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW5:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW6:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW7:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW8:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW9:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW10:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW11:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW12:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW13:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW14:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW15:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW16:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW17:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW18:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW19:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW20:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW21:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW22:   file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV3:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV4:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV5:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV6:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV7:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV8:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes;
    CAT:    file = "%O.cat", start = $8000, size = $2000, type = ro, define = yes;
}
