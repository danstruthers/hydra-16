# ****************************************************************************
# dq0w.cfg - (dq0w) the world's link: sdk/c/hydra.cfg's, and its swapped parts (../dq0/swap.inc): code run in the main
# RAM's top (SWAP: __SWAPSIZE__ bytes under the C stack's least room), a part at a time, SWn all there, their images
# in OV1 ... (%O.ovl: LIBDIR/dq0w.ovl, 8K each, read into banks as the task starts), each copied into the area as it's
# called.  And the catalogue's kinds (kinds.c's, KIN: the hub's KIND_BANK, make.js putting their words after them),
# then the catalogue's things' words and the code that handles things (things.c's, CATCODE: the hub's CAT_BANK), each
# linked at $8000, into a file of their own, %O.cat (LIBDIR/dq0w.cat), which the world reads as it starts into the
# hub's banks, where they're at $8000 as linked (the catalogue's code run there: bank.s's m0 ...).
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (a link that leaves
                                                        #   less fails, rather than the stack running over the BSS)
    __SWAPSIZE__:   type = weak,    value = $0E80;      # The swapped parts' area (../dq0/swap.inc): the biggest
    __SWAP_START__: type = export,  value = __RAMTOP__ - __STACKMIN__ - __SWAPSIZE__;   #   part, or more, and 64 (the parts' headroom, 2026-11-18)
}
MEMORY {
    ZP:     file = "", start = $0022, size = $0022,             type = rw, define = yes;  # (To $43: $44 on, the game's library's block, ../dq0/lnzp.inc's LZ)
    MAIN:   file = %O, start = $0800, size = __SWAP_START__ - $0800, type = rw, define = yes;
    #@SWMEMORY
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
