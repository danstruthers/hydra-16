# ****************************************************************************
# dq0p.cfg - (dq0p) the senses' and things' link: sdk/c/hydra.cfg's (the header, code, read-only data and data from
# $0800, the BSS after them, the heap, and the C stack down from __RAMTOP__), and one overlay: the catalogue
# (kinds.c, first) and the things' words, then the code that handles things (things.c's, OV1CODE), linked at $8000
# into a second file, %O.ovl, which the task reads as it starts into the hub's catalogue bank, where it's at $8000
# as linked (its code run there: bank.s).  And its swapped parts (../dq0/swap.inc): code run in the main RAM's top
# (SWAP: __SWAPSIZE__ bytes under the C stack's least room), a part at a time, SWn all there, their images in OV2,
# after the catalogue in %O.ovl (read into a bank of the task's own), each copied into the area as it's called.
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7F00;      # (Page-aligned; task F's RAM stops there too)
    __STACKMIN__:   type = weak,    value = $0300;      # The least room left for the C stack (hydra.cfg's)
    __SWAPSIZE__:   type = weak,    value = $04A0;      # The swapped parts' area (../dq0/swap.inc): the biggest
    __SWAP_START__: type = export,  value = __RAMTOP__ - __STACKMIN__ - __SWAPSIZE__;   #   part, or more
}
MEMORY {
    ZP:     file = "", start = $0022, size = $005E,             type = rw, define = yes;
    MAIN:   file = %O, start = $0800, size = __SWAP_START__ - $0800, type = rw, define = yes;
    SW1:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW2:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW3:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    SW4:    file = "", start = __SWAP_START__, size = __SWAPSIZE__, type = rw, define = yes;
    OV1:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes, fill = yes, fillval = $FF;
    OV2:    file = "%O.ovl", start = $8000, size = $2000, type = ro, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HEADER:     load = MAIN, type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
    OV1RODATA:  load = OV1,  type = ro,  optional = yes;  # (The kinds first, at $8000: hub.h's CATALOGUE)
    OV1CODE:    load = OV1,  type = ro,  optional = yes;
    SW1CODE:    load = OV2,  run = SW1,  type = ro,  define = yes;
    SW1RODATA:  load = OV2,  run = SW1,  type = ro,  optional = yes;
    SW2CODE:    load = OV2,  run = SW2,  type = ro,  define = yes;
    SW2RODATA:  load = OV2,  run = SW2,  type = ro,  optional = yes;
    SW3CODE:    load = OV2,  run = SW3,  type = ro,  define = yes;
    SW3RODATA:  load = OV2,  run = SW3,  type = ro,  optional = yes;
    SW4CODE:    load = OV2,  run = SW4,  type = ro,  define = yes;
    SW4RODATA:  load = OV2,  run = SW4,  type = ro,  optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
