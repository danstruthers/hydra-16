# Build everything and run the regression tests in the emulator, on every push and pull request.
# cc65 is built from its source, at the commit of the snapshot the project builds with (C:\source\cc65\win64_snapshot:
# ca65 V2.19, Git 1d1dd42, July 2024), so the images in Git are the build's.  Later cc65 took WAI and STP out of
# --cpu 65C02 (they're W65C02's since 2025), which the snapshot doesn't name; build.js finds it through CC65_HOME.
# The runner is pinned (ubuntu-24.04, not ubuntu-latest, which moves to 26.04 in late 2026), and the actions are the
# ones that run on Node 24 (v7: GitHub's Node 20 is gone).
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: cc65
        run: |
          git init -q "$RUNNER_TEMP/cc65"
          git -C "$RUNNER_TEMP/cc65" fetch -q --depth 1 https://github.com/cc65/cc65.git 1d1dd425c1148e02dbe0af72b9d11959e20101fb
          git -C "$RUNNER_TEMP/cc65" checkout -q FETCH_HEAD
          make -C "$RUNNER_TEMP/cc65" -j4
          echo "CC65_HOME=$RUNNER_TEMP/cc65" >> "$GITHUB_ENV"
      - name: The base (the kernel, ser, kdev, the monitor), build and test
        run: node base/build.js && node base/sim/test.js
      - name: HydraOS, build and test (its build builds the base first; its tests are the base's and its own)
        run: node reborn/build.js && node reborn/sim/test.js
      - name: The emulator in a browser (its page built, its worker booted in Node)
        run: node reborn/sim/web.js --check
      - name: The old system (frozen in old/), build and test
        run: node old/build.js test
      - name: The images and the SDK's generated files, if they changed (the ones in Git should be the build's)
        run: git status --short -- base/bin base/sdk reborn/bin reborn/sdk old/os_rom/bin old/programs
