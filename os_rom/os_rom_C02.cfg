MEMORY {
  ZP:           start = $0000,  size = $0100,  type = rw, file = "";
  STACK:        start = $0100,  size = $0100,  type = rw, file = "";
  TASK_RAM:     start = $0200,  size = $7D00,  type = rw, file = "";
  PAGED_RAM:    start = $8000,  size = $2000,  type = rw, file = "";
  # Paged ROM ($A000-$DFFF, bank in ROM_BANK_REG): the hardware swaps the 8K halves of each 16K bank
  # (A13), so bank 0 is written to the file as the $C000 half (ROM offset $0000), then the $A000 half
  # (ROM offset $2000).
  PAGED_ROM_B0_C: start = $C000, size = $2000,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  # (Its first 512 bytes, $A000-$A1FF: the ROM disk's block 0, its partition table: sim/tools/mkromdisk.js)
  PAGED_ROM_B0_MBR: start = $A000, size = $0200, type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  PAGED_ROM_B0_A: start = $A200, size = $0100,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  PAGED_ROM_B0_A_CODE: start = $A300, size = $1D00, type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  # Bank 1: the hardware test (hwtest/), the same way round
  PAGED_ROM_B1_C: start = $C000, size = $2000,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  PAGED_ROM_B1_A: start = $A000, size = $2000,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  # Bank 2: the test song (songs/test_rom.s), the same way round
  PAGED_ROM_B2_C: start = $C000, size = $2000,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  PAGED_ROM_B2_A: start = $A000, size = $2000,  type = ro, fill = yes, file = "bin/paged_rom_C02.bin";
  FORTH_RAM:    start = $0800,  size = $7800,  type = rw, file = "";
  # BIOS ROM pages (W = $0-$F): each is an 8K area at $E000, written one after another to the same file
  OS_ROM_P0:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P1:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P2:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P3:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P4:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P5:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P6:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P7:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P8:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_P9:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PA:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PB:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PC:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PD:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PE:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
  OS_ROM_PF:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "bin/os_rom_C02.bin";
}

SEGMENTS {
  ZEROPAGE:     load  = ZP, type = zp, define = yes;
  STACK:        load  = STACK, type = rw;
  BUFFERS:      load  = TASK_RAM, type = rw;
  FORTH_PAGED_ROM: load = PAGED_ROM_B0_A, type = ro;
  # HyForth's variables: stored in the paged ROM at $A100 (COPYSTART), copied to RAM at $0800 by COPYTORAM
  FORTH_DATA:   load  = PAGED_ROM_B0_A_CODE, run = FORTH_RAM, type = rw;
  # HyForth's read-only data in the paged ROM (bank 0, which HyForth's task always has at $A000-$DFFF)
  FORTH_ROM_DATA: load = PAGED_ROM_B0_C, type = ro;
  # The hardware test (paged ROM bank 1): its entry at $A000, the ROMs' checksums at its end ($DFC0)
  HWT_A:        load  = PAGED_ROM_B1_A, type = ro;
  HWT_C:        load  = PAGED_ROM_B1_C, type = ro;
  HWT_SUMS:     load  = PAGED_ROM_B1_C, type = ro,  offset = $1FC0;
  SONG_A:       load  = PAGED_ROM_B2_A, type = ro;
  SONG_C:       load  = PAGED_ROM_B2_C, type = ro,  optional = yes;
  # Page 0: BIOS / OS
  BIOS_P0:      load  = OS_ROM_P0, type = ro;
  MMU:          load  = OS_ROM_P0, type = ro;
  SOUND:        load  = OS_ROM_P0, type = ro;
  TASKS:        load  = OS_ROM_P0, type = ro;
  IRQ:          load  = OS_ROM_P0, type = ro;
  SHARED:       load  = OS_ROM_P0, type = ro;
  IO_P0:        load  = OS_ROM_P0, type = ro;
  GATES_P0:     load  = OS_ROM_P0, type = ro;
  BIOS_THUNKS:  load  = OS_ROM_P0, type = ro,  offset = $1800;
  BIOS:         load  = OS_ROM_P0, type = ro;           # Right after the thunks
  COMMON_P0:    load  = OS_ROM_P0, type = ro,  offset = $1D00;
  HIGH_P0:      load  = OS_ROM_P0, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  IO_PORTS:     load  = OS_ROM_P0, type = ro,  offset = $1F00;
  RESETVEC_P0:  load  = OS_ROM_P0, type = ro,  offset = $1FFA;
  # Page 1: HyForth (its engine, then its words' code and headers; its gates and debug code after the thunks)
  BIOS_P1:      load  = OS_ROM_P1, type = ro;
  FORTH_ROM:    load  = OS_ROM_P1, type = ro;
  FORTH_CORE:   load  = OS_ROM_P1, type = ro;
  BIOS_THUNKS_P1: load = OS_ROM_P1, type = ro, offset = $1800;
  GATES_P1:     load  = OS_ROM_P1, type = ro;
  FORTH_HIGH:   load  = OS_ROM_P1, type = ro;
  COMMON_P1:    load  = OS_ROM_P1, type = ro,  offset = $1D00;
  FORTH_TOP:    load  = OS_ROM_P1, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P1:  load  = OS_ROM_P1, type = ro,  offset = $1FFA;
  # Page 2: the IO layer and the file servers
  BIOS_P2:      load  = OS_ROM_P2, type = ro;
  IO_P2:        load  = OS_ROM_P2, type = ro;
  GATES_P2:     load  = OS_ROM_P2, type = ro;
  COMMON_P2:    load  = OS_ROM_P2, type = ro,  offset = $1D00;
  HIGH_P2:      load  = OS_ROM_P2, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P2:  load  = OS_ROM_P2, type = ro,  offset = $1FFA;
  # Page 3: storage (SPI, the SD card, /dev/sd; later FAT32)
  BIOS_P3:      load  = OS_ROM_P3, type = ro;
  STORAGE_P3:   load  = OS_ROM_P3, type = ro;
  GATES_P3:     load  = OS_ROM_P3, type = ro;
  COMMON_P3:    load  = OS_ROM_P3, type = ro,  offset = $1D00;
  HIGH_P3:      load  = OS_ROM_P3, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P3:  load  = OS_ROM_P3, type = ro,  offset = $1FFA;
  # Page 4: the self tests (MMU, scheduler, IO, POST RAM)
  BIOS_P4:      load  = OS_ROM_P4, type = ro;
  TESTS_P4:     load  = OS_ROM_P4, type = ro;
  GATES_P4:     load  = OS_ROM_P4, type = ro;
  COMMON_P4:    load  = OS_ROM_P4, type = ro,  offset = $1D00;
  HIGH_P4:      load  = OS_ROM_P4, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P4:  load  = OS_ROM_P4, type = ro,  offset = $1FFA;
  # Page 5: far pointers and references (pages 6-A below; pages B-F: unused)
  BIOS_P5:      load  = OS_ROM_P5, type = ro;
  FP_P5:        load  = OS_ROM_P5, type = ro;           # Far pointers and references (fp.s)
  GATES_P5:     load  = OS_ROM_P5, type = ro;
  COMMON_P5:    load  = OS_ROM_P5, type = ro,  offset = $1D00;
  HIGH_P5:      load  = OS_ROM_P5, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P5:  load  = OS_ROM_P5, type = ro,  offset = $1FFA;
  # Page 6: the HydraFS server (in the storage task, on page 3's block layer)
  BIOS_P6:      load  = OS_ROM_P6, type = ro;
  HFS_P6:       load  = OS_ROM_P6, type = ro;
  GATES_P6:     load  = OS_ROM_P6, type = ro;
  COMMON_P6:    load  = OS_ROM_P6, type = ro,  offset = $1D00;
  HIGH_P6:      load  = OS_ROM_P6, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P6:  load  = OS_ROM_P6, type = ro,  offset = $1FFA;
  # Page 7: the shell (its boot, prompt, file commands, running programs)
  BIOS_P7:      load  = OS_ROM_P7, type = ro;
  SHELL_P7:     load  = OS_ROM_P7, type = ro;
  GATES_P7:     load  = OS_ROM_P7, type = ro;
  COMMON_P7:    load  = OS_ROM_P7, type = ro,  offset = $1D00;
  HIGH_P7:      load  = OS_ROM_P7, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P7:  load  = OS_ROM_P7, type = ro,  offset = $1FFA;
  # Page 8: the text editor (edit)
  BIOS_P8:      load  = OS_ROM_P8, type = ro;
  EDIT_P8:      load  = OS_ROM_P8, type = ro;
  GATES_P8:     load  = OS_ROM_P8, type = ro;
  COMMON_P8:    load  = OS_ROM_P8, type = ro,  offset = $1D00;
  HIGH_P8:      load  = OS_ROM_P8, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P8:  load  = OS_ROM_P8, type = ro,  offset = $1FFA;
  # Page 9: the system's servers in their client's task (/dev/proc, /env)
  BIOS_P9:      load  = OS_ROM_P9, type = ro;
  SYS_P9:       load  = OS_ROM_P9, type = ro;
  GATES_P9:     load  = OS_ROM_P9, type = ro;
  COMMON_P9:    load  = OS_ROM_P9, type = ro,  offset = $1D00;
  HIGH_P9:      load  = OS_ROM_P9, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_P9:  load  = OS_ROM_P9, type = ro,  offset = $1FFA;
  # Page A: HyForth's far words (hyforth/farwords.s) and the disassembler
  BIOS_PA:      load  = OS_ROM_PA, type = ro;
  DISASM:       load  = OS_ROM_PA, type = ro;
  DISASM_CODE:  load  = OS_ROM_PA, type = ro;
  FORTH_FAR:    load  = OS_ROM_PA, type = ro;
  GATES_PA:     load  = OS_ROM_PA, type = ro;
  COMMON_PA:    load  = OS_ROM_PA, type = ro,  offset = $1D00;
  HIGH_PA:      load  = OS_ROM_PA, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PA:  load  = OS_ROM_PA, type = ro,  offset = $1FFA;
  BIOS_PB:      load  = OS_ROM_PB, type = ro;
  SOUND_PB:     load  = OS_ROM_PB, type = ro;
  GATES_PB:     load  = OS_ROM_PB, type = ro;
  COMMON_PB:    load  = OS_ROM_PB, type = ro,  offset = $1D00;
  HIGH_PB:      load  = OS_ROM_PB, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PB:  load  = OS_ROM_PB, type = ro,  offset = $1FFA;
  BIOS_PC:      load  = OS_ROM_PC, type = ro;
  PLAYER_PC:    load  = OS_ROM_PC, type = ro;
  GATES_PC:     load  = OS_ROM_PC, type = ro;
  COMMON_PC:    load  = OS_ROM_PC, type = ro,  offset = $1D00;
  HIGH_PC:      load  = OS_ROM_PC, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PC:  load  = OS_ROM_PC, type = ro,  offset = $1FFA;
  BIOS_PD:      load  = OS_ROM_PD, type = ro;
  COMMON_PD:    load  = OS_ROM_PD, type = ro,  offset = $1D00;
  HIGH_PD:      load  = OS_ROM_PD, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PD:  load  = OS_ROM_PD, type = ro,  offset = $1FFA;
  BIOS_PE:      load  = OS_ROM_PE, type = ro;
  COMMON_PE:    load  = OS_ROM_PE, type = ro,  offset = $1D00;
  HIGH_PE:      load  = OS_ROM_PE, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PE:  load  = OS_ROM_PE, type = ro,  offset = $1FFA;
  BIOS_PF:      load  = OS_ROM_PF, type = ro;
  COMMON_PF:    load  = OS_ROM_PF, type = ro,  offset = $1D00;
  HIGH_PF:      load  = OS_ROM_PF, type = ro,  offset = $1E00;    # $FE00-$FEFF: above COMMON, below the I/O space
  RESETVEC_PF:  load  = OS_ROM_PF, type = ro,  offset = $1FFA;
}
