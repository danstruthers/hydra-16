MEMORY {
  ZP:           start = $0000,  size = $0100,  type = rw, file = "";
  STACK:        start = $0100,  size = $0100,  type = rw, file = "";
  TASK_RAM:     start = $0200,  size = $7D00,  type = rw, file = "";
  PAGED_RAM:    start = $8000,  size = $2000,  type = rw, file = "";
  # Paged ROM ($A000-$DFFF, bank in ROM_BANK_REG): the hardware swaps the 8K halves of each 16K bank
  # (A13), so bank 0 is written to the file as the $C000 half (ROM offset $0000), then the $A000 half
  # (ROM offset $2000).
  PAGED_ROM_B0_C: start = $C000, size = $2000,  type = ro, fill = yes, file = "tmp\paged_rom_C02.bin";
  PAGED_ROM_B0_A: start = $A000, size = $0100,  type = ro, fill = yes, file = "tmp\paged_rom_C02.bin";
  PAGED_ROM_B0_A_CODE: start = $A100, size = $1F00, type = ro, fill = yes, file = "tmp\paged_rom_C02.bin";
  FORTH_RAM:    start = $0800,  size = $7800,  type = rw, file = "";
  # BIOS ROM pages (W = $0-$F): each is an 8K area at $E000, written one after another to the same file
  OS_ROM_P0:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P1:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P2:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P3:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P4:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P5:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P6:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P7:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P8:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_P9:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PA:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PB:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PC:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PD:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PE:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
  OS_ROM_PF:    start = $E000,  size = $2000,  type = ro, fill = yes, fillval = $EA, file = "tmp\os_rom_C02.bin";
}

SEGMENTS {
  ZEROPAGE:     load  = ZP, type = zp, define = yes;
  STACK:        load  = STACK, type = rw;
  BUFFERS:      load  = TASK_RAM, type = rw;
  FORTH_PAGED_ROM: load = PAGED_ROM_B0_A, type = ro;
  # Stored in the paged ROM at $A100 (COPYSTART), copied to and run at $0800 by COPYTORAM
  FORTH_CODE:   load  = PAGED_ROM_B0_A_CODE, run = FORTH_RAM, type = rw;
  # Page 0: BIOS / OS
  BIOS_P0:      load  = OS_ROM_P0, type = ro;
  MMU:          load  = OS_ROM_P0, type = ro;
  SHELL:        load  = OS_ROM_P0, type = ro;
  TASKS:        load  = OS_ROM_P0, type = ro;
  IRQ:          load  = OS_ROM_P0, type = ro;
  MSG:          load  = OS_ROM_P0, type = ro;
  SHARED:       load  = OS_ROM_P0, type = ro;
  IO_P0:        load  = OS_ROM_P0, type = ro;
  GATES_P0:     load  = OS_ROM_P0, type = ro;
  BIOS_THUNKS:  load  = OS_ROM_P0, type = ro,  offset = $1800;
  BIOS:         load  = OS_ROM_P0, type = ro,  offset = $18C0;
  COMMON_P0:    load  = OS_ROM_P0, type = ro,  offset = $1D00;
  WOZMON:       load  = OS_ROM_P0, type = ro,  offset = $1E00;
  IO_PORTS:     load  = OS_ROM_P0, type = ro,  offset = $1F00;
  RESETVEC_P0:  load  = OS_ROM_P0, type = ro,  offset = $1FFA;
  # Page 1: HyForth and the disassembler
  BIOS_P1:      load  = OS_ROM_P1, type = ro;
  TESTS_P1:     load  = OS_ROM_P1, type = ro;           # In the gap below DISASM
  DISASM:       load  = OS_ROM_P1, type = ro,  offset = $0640;
  DISASM_CODE:  load  = OS_ROM_P1, type = ro,  offset = $0840;
  FORTH_ROM:    load  = OS_ROM_P1, type = ro,  offset = $0A00;
  GATES_P1:     load  = OS_ROM_P1, type = ro;
  BIOS_THUNKS_P1: load = OS_ROM_P1, type = ro, offset = $1800;
  COMMON_P1:    load  = OS_ROM_P1, type = ro,  offset = $1D00;
  RESETVEC_P1:  load  = OS_ROM_P1, type = ro,  offset = $1FFA;
  # Page 2: the IO layer; pages 3-F: unused
  BIOS_P2:      load  = OS_ROM_P2, type = ro;
  IO_P2:        load  = OS_ROM_P2, type = ro;
  POST_P2:      load  = OS_ROM_P2, type = ro;
  SPI_P2:       load  = OS_ROM_P2, type = ro;
  GATES_P2:     load  = OS_ROM_P2, type = ro;
  COMMON_P2:    load  = OS_ROM_P2, type = ro,  offset = $1D00;
  RESETVEC_P2:  load  = OS_ROM_P2, type = ro,  offset = $1FFA;
  BIOS_P3:      load  = OS_ROM_P3, type = ro;
  COMMON_P3:    load  = OS_ROM_P3, type = ro,  offset = $1D00;
  RESETVEC_P3:  load  = OS_ROM_P3, type = ro,  offset = $1FFA;
  BIOS_P4:      load  = OS_ROM_P4, type = ro;
  COMMON_P4:    load  = OS_ROM_P4, type = ro,  offset = $1D00;
  RESETVEC_P4:  load  = OS_ROM_P4, type = ro,  offset = $1FFA;
  BIOS_P5:      load  = OS_ROM_P5, type = ro;
  COMMON_P5:    load  = OS_ROM_P5, type = ro,  offset = $1D00;
  RESETVEC_P5:  load  = OS_ROM_P5, type = ro,  offset = $1FFA;
  BIOS_P6:      load  = OS_ROM_P6, type = ro;
  COMMON_P6:    load  = OS_ROM_P6, type = ro,  offset = $1D00;
  RESETVEC_P6:  load  = OS_ROM_P6, type = ro,  offset = $1FFA;
  BIOS_P7:      load  = OS_ROM_P7, type = ro;
  COMMON_P7:    load  = OS_ROM_P7, type = ro,  offset = $1D00;
  RESETVEC_P7:  load  = OS_ROM_P7, type = ro,  offset = $1FFA;
  BIOS_P8:      load  = OS_ROM_P8, type = ro;
  COMMON_P8:    load  = OS_ROM_P8, type = ro,  offset = $1D00;
  RESETVEC_P8:  load  = OS_ROM_P8, type = ro,  offset = $1FFA;
  BIOS_P9:      load  = OS_ROM_P9, type = ro;
  COMMON_P9:    load  = OS_ROM_P9, type = ro,  offset = $1D00;
  RESETVEC_P9:  load  = OS_ROM_P9, type = ro,  offset = $1FFA;
  BIOS_PA:      load  = OS_ROM_PA, type = ro;
  COMMON_PA:    load  = OS_ROM_PA, type = ro,  offset = $1D00;
  RESETVEC_PA:  load  = OS_ROM_PA, type = ro,  offset = $1FFA;
  BIOS_PB:      load  = OS_ROM_PB, type = ro;
  COMMON_PB:    load  = OS_ROM_PB, type = ro,  offset = $1D00;
  RESETVEC_PB:  load  = OS_ROM_PB, type = ro,  offset = $1FFA;
  BIOS_PC:      load  = OS_ROM_PC, type = ro;
  COMMON_PC:    load  = OS_ROM_PC, type = ro,  offset = $1D00;
  RESETVEC_PC:  load  = OS_ROM_PC, type = ro,  offset = $1FFA;
  BIOS_PD:      load  = OS_ROM_PD, type = ro;
  COMMON_PD:    load  = OS_ROM_PD, type = ro,  offset = $1D00;
  RESETVEC_PD:  load  = OS_ROM_PD, type = ro,  offset = $1FFA;
  BIOS_PE:      load  = OS_ROM_PE, type = ro;
  COMMON_PE:    load  = OS_ROM_PE, type = ro,  offset = $1D00;
  RESETVEC_PE:  load  = OS_ROM_PE, type = ro,  offset = $1FFA;
  BIOS_PF:      load  = OS_ROM_PF, type = ro;
  COMMON_PF:    load  = OS_ROM_PF, type = ro,  offset = $1D00;
  RESETVEC_PF:  load  = OS_ROM_PF, type = ro,  offset = $1FFA;
}
