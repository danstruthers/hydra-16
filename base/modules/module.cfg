# ****************************************************************************
# module.cfg - a module in the paged ROM, run in place (HYX2: sdk/asm/hyx2.inc): its header, code and read-only
# data at $A000 in its own bank (16K at most), its data and BSS in its task's RAM from $0400 (below $7FF8: task
# F's top bytes are the DS1747's registers).  Its zero page is $22-$7F (the program's).
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw, file = "";
    ROM:    start = $A000, size = $4000, type = ro, file = %O, define = yes;
    RAM:    start = $0400, size = $7BF8, type = rw, file = "", define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = ROM, type = ro;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro, optional = yes;
    DATA:       load = ROM, run = RAM, type = rw, define = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
