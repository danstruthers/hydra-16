# ****************************************************************************
# bank.cfg - a bank program (HF_BANK: sdk/asm/hyx2.inc, assembled with -D HYX2_BANK; reborn/docs/design/plans/RUN.md):
# an o65 module, linked at $8000 where a RAM bank of its task's (or its caller's, RUN) has it: its header (the HYX2
# one: its name, its main), code, read-only data and data one after another, its BSS after them, all of it with its
# run frame and a copy of its data in one cache bank's room (RB_TOP - RB_MODS, less the frame: 41 bytes and its
# zero page's).  Its zero
# page the program's, $22 up (in the file, so it could be moved).  A module put where it was linked (a bank's first)
# isn't relocated at all.  The build puts a copy of its HYX2 header (HF_BANK set) before it in its file.
MEMORY {
    ZP:     start = $0022, size = $005E, type = rw;
    RAM:    start = $8000, size = $1D70, type = rw, define = yes;
}
FILES {
    %O: format = o65;
}
FORMATS {
    o65: os = cc65, id = $8001, type = small;
}
SEGMENTS {
    ZEROPAGE:   load = ZP, type = zp, optional = yes;
    HEADER:     load = RAM, type = ro;
    CODE:       load = RAM, type = ro;
    RODATA:     load = RAM, type = ro, optional = yes;
    DATA:       load = RAM, type = rw, define = yes;
    BSS:        load = RAM, type = bss, define = yes;
}
