<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 432" font-family="Courier New, monospace" font-size="14">
<rect width="696" height="432" rx="8" fill="#14181c"/>
<rect x="12.0" y="12" width="672.0" height="17" fill="#d9d9d9"/>
<text x="12.0" y="25" fill="#14181c" xml:space="preserve"> edit  /ram/story.txt *                                         line 4/4  col 1 </text>
<text x="12.0" y="42" fill="#d9d9d9" xml:space="preserve">Once upon a time, a Hydra woke up.                                              </text>
<text x="12.0" y="59" fill="#d9d9d9" xml:space="preserve">It had sixteen heads, and each one                                              </text>
<text x="12.0" y="76" fill="#d9d9d9" xml:space="preserve">wanted to run a different program.                                              </text>
<rect x="12.0" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="12.0" y="399" fill="#14181c" xml:space="preserve">^G</text>
<text x="28.8" y="399" fill="#d9d9d9" xml:space="preserve"> Help    </text>
<rect x="104.4" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="104.4" y="399" fill="#14181c" xml:space="preserve">^O</text>
<text x="121.2" y="399" fill="#d9d9d9" xml:space="preserve"> Save    </text>
<rect x="196.8" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="196.8" y="399" fill="#14181c" xml:space="preserve">^R</text>
<text x="213.6" y="399" fill="#d9d9d9" xml:space="preserve"> Open    </text>
<rect x="289.2" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="289.2" y="399" fill="#14181c" xml:space="preserve">^W</text>
<text x="306.0" y="399" fill="#d9d9d9" xml:space="preserve"> Find    </text>
<rect x="381.6" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="381.6" y="399" fill="#14181c" xml:space="preserve">^K</text>
<text x="398.4" y="399" fill="#d9d9d9" xml:space="preserve"> Cut     </text>
<rect x="474.0" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="474.0" y="399" fill="#14181c" xml:space="preserve">^U</text>
<text x="490.8" y="399" fill="#d9d9d9" xml:space="preserve"> Paste   </text>
<rect x="566.4" y="386" width="16.8" height="17" fill="#d9d9d9"/>
<text x="566.4" y="399" fill="#14181c" xml:space="preserve">^X</text>
<text x="583.2" y="399" fill="#d9d9d9" xml:space="preserve"> Exit       </text>
<rect x="12.0" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="12.0" y="416" fill="#14181c" xml:space="preserve">M-A</text>
<text x="37.2" y="416" fill="#d9d9d9" xml:space="preserve"> Mark   </text>
<rect x="104.4" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="104.4" y="416" fill="#14181c" xml:space="preserve">M-6</text>
<text x="129.6" y="416" fill="#d9d9d9" xml:space="preserve"> Copy   </text>
<rect x="196.8" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="196.8" y="416" fill="#14181c" xml:space="preserve">M-R</text>
<text x="222.0" y="416" fill="#d9d9d9" xml:space="preserve"> Replace</text>
<rect x="289.2" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="289.2" y="416" fill="#14181c" xml:space="preserve">M-U</text>
<text x="314.4" y="416" fill="#d9d9d9" xml:space="preserve"> Undo   </text>
<rect x="381.6" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="381.6" y="416" fill="#14181c" xml:space="preserve">M-E</text>
<text x="406.8" y="416" fill="#d9d9d9" xml:space="preserve"> Redo   </text>
<rect x="474.0" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="474.0" y="416" fill="#14181c" xml:space="preserve">M-G</text>
<text x="499.2" y="416" fill="#d9d9d9" xml:space="preserve"> Line   </text>
<rect x="566.4" y="403" width="25.2" height="17" fill="#d9d9d9"/>
<text x="566.4" y="416" fill="#14181c" xml:space="preserve">M-.</text>
<text x="591.6" y="416" fill="#d9d9d9" xml:space="preserve"> File      </text>
<rect x="12.0" y="93" width="8.4" height="3" fill="#d9d9d9"/>
</svg>
