# A Hydra executable (.hyx): the 16-byte header (hyx.inc's HYX_HEADER), then the program, linked to run at
# $0800 in its task's RAM.  Everything is in the file: there's no BSS segment (a program's variables go in
# DATA; RAM it uses above its end, it keeps from the MMU with MM_SET_FLOOR).
MEMORY {
    HDR:    start = $0000, size = $0010, type = ro, file = %O;
    PROG:   start = $0800, size = $7400, type = rw, file = %O, define = yes;
}
SEGMENTS {
    HYXHDR: load = HDR,  type = ro;
    CODE:   load = PROG, type = rw;
    RODATA: load = PROG, type = ro, optional = yes;
    DATA:   load = PROG, type = rw, optional = yes;
}
