# A C program for the Hydra-16 (cc65, with lib/hydra.lib): a Hydra executable (.hyx), its 16-byte header
# (crt0.s), then the program, linked to run at $0800 in its task's RAM.  Its RAM goes up to __RAMTOP__: the
# program, its BSS (cleared at the start), the heap (malloc), and the C stack (__STACKSIZE__, down from
# __RAMTOP__).  The MMU keeps the pages from __RAMTOP__ to $7CFF for MM_ALLOC.  The zero page from $E0 is the
# C library's (the OS's stays below: os_rom/include/kernel.inc, PROGRAM_ZP).
SYMBOLS {
    __STACKSIZE__:  type = weak,    value = $0800;      # 2K of C stack
    __RAMTOP__:     type = weak,    value = $7000;      # (Page-aligned)
}
MEMORY {
    ZP:     file = "", start = $00E0, size = $0020,             type = rw, define = yes;
    HDR:    file = %O, start = $0000, size = $0010,             type = ro;
    MAIN:   file = %O, start = $0800, size = __RAMTOP__ - $0800, type = rw, define = yes;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    HYXHDR:     load = HDR,  type = ro;
    STARTUP:    load = MAIN, type = ro;
    LOWCODE:    load = MAIN, type = ro,  optional = yes;
    ONCE:       load = MAIN, type = ro,  optional = yes;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw,  define = yes;
    INIT:       load = MAIN, type = bss, optional = yes;
    BSS:        load = MAIN, type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
